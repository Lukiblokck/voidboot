
name: build-image
run-name: Build Hana GNOME image

on:
  push:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read

    strategy:
      matrix:
        board: [hana]

    runs-on: ubuntu-latest

    steps:
      - name: Remove snap
        uses: ading2210/gh-actions-remove-snap@v1
        with:
          disable_man_db: 'true'

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Download repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget python3 unzip zip git debootstrap cpio \
            binwalk pcregrep cgpt kmod pv lz4 cryptsetup \
            qemu-user-static binfmt-support

      - name: Run build
        run: |
          sudo DEBUG=1 ./build_complete.sh ${{ matrix.board }} \
            desktop=gnome \
            arch=arm64 \
            compress_img=1 \
            quiet=1

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: hana-gnome
          path: |
            data/shimboot_hana.zip
            data/shimboot_hana.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Create release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: |
            data/shimboot_hana.zip

